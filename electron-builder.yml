appId: com.paperphone.lite.desktop
productName: PaperPhoneLite
directories:
  buildResources: build
  output: release/${version}

files:
  - dist-electron/**/*
  - dist/**/*

extraResources:
  - from: resources/tor
    to: tor

# Disable auto-update publish (no update server configured)
publish: null

# Windows
win:
  executableName: PaperPhoneLite
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  shortcutName: PaperPhoneLite
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-Windows-Setup.${ext}

portable:
  artifactName: ${productName}-${version}-Windows-Portable.${ext}
